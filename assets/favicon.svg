<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Crossed Tools / Anvil Silhouette -->
  <g fill="url(#goldGrad)" transform="translate(256, 230) scale(1.2)">
    <!-- Hammer 1 -->
    <path d="M-80,-110 L-50,-130 L-10,-90 L-40,-70 Z" transform="rotate(-30)"/>
    <rect x="-8" y="-90" width="16" height="140" rx="6" transform="rotate(-30)"/>
    <!-- Hammer 2 -->
    <rect x="-8" y="-90" width="16" height="140" rx="6" transform="rotate(30)"/>
    <path d="M10,-90 L50,-130 L80,-110 L40,-70 Z" transform="rotate(30)"/>
    <!-- Center Anvil / Eagle Emblem -->
    <path d="M-60,10 C-60,10 -30,-20 0,-20 C30,-20 60,10 60,10 C40,40 20,60 0,60 C-20,60 -40,40 -60,10 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- SteelQuote Text / Monogram SQ -->
  <text x="256" y="420" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="90" fill="#ffffff" text-anchor="middle" letter-spacing="4">SteelQuote</text>
</svg>
